apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gowebapp.fullname" . }}
  namespace: {{ .Release.Namespace | default "gowebapp" }}
  labels:
    {{- include "gowebapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "gowebapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gowebapp.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
      
      initContainers:
        - name: prepare-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sed \
                -e "s/__MYSQL_APP_PASSWORD__/${MYSQL_APP_PASSWORD}/g" \
                -e "s/__SESSION_SECRET_KEY__/${SESSION_SECRET_KEY}/g" \
                /config-template/config.json.tmpl > /config-out/config.json
              chown 1001:1001 /config-out/config.json
          env:
            - name: MYSQL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gowebapp.fullname" . }}-secrets
                  key: mysql-app-password
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gowebapp.fullname" . }}-secrets
                  key: session-secret-key
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.configmap.server.httpPort }}
              name: http
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config-out
              mountPath: /app/config
              readOnly: true
          env:
            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.configmap.server.httpPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.configmap.server.httpPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

      volumes:
        - name: config-template
          configMap:
            name: {{ include "gowebapp.fullname" . }}-config
        - name: config-out
          emptyDir: {}