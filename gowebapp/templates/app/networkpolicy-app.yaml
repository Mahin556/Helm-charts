{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for the application
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gowebapp.fullname" . }}-app-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gowebapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gowebapp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  # Ingress rules - what can connect to the app
  ingress:
    # Allow traffic from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.app.service.targetPort }}
    
    # Allow health checks from kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: {{ .Values.app.service.targetPort }}
  
  # Egress rules - what the app can connect to
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow connection to MySQL
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: {{ .Values.mysql.config.port }}
    
    # Allow outbound HTTPS for external APIs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
{{- end }}