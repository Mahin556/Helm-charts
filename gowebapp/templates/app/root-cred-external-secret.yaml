{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.secrets.rootCredentials.enabled }}
# ExternalSecret for ROOT credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ include "gowebapp.fullname" . }}{{ .Values.externalSecrets.secrets.rootCredentials.suffix }}'
  namespace: '{{ .Release.Namespace }}'
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: '{{ .Values.externalSecrets.refreshInterval }}'
  secretStoreRef:
    name: '{{ .Values.externalSecrets.store.name }}'
    kind: '{{ .Values.externalSecrets.store.kind }}'
  target:
    name: '{{ include "gowebapp.fullname" . }}{{ .Values.externalSecrets.secrets.rootCredentials.suffix }}'
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets.rootCredentials.keys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecrets.secrets.rootCredentials.vaultPath }}
        property: {{ .property }}
    {{- end }}
{{- end }}
{{- end }}