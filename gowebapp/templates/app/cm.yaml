# =============================================================================
# ConfigMap — application config.json (non-sensitive fields only)
#
# The DB password and session key are injected at runtime from the Secret
# via an init container that writes the final config.json to an emptyDir.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "gowebapp.fullname" . }}{{ .Values.config.suffix }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    {{- include "gowebapp.labels" . | nindent 4 }}
data:
  # Template — placeholders are replaced by the init container
  config.json.tmpl: |
    {
      "Database": {
        "Type": "MySQL",
        "Bolt": {
          "Path": "gowebapp.db"
        },
        "MongoDB": {
          "URL": "127.0.0.1",
          "Database": "gowebapp"
        },
        "MySQL": {
          "Username": "__DB_USERNAME__",
          "Password": "__MYSQL_APP_PASSWORD__",
          "Name": "__DB_NAME__",
          "Hostname": "__DB_ENDPOINT__",
          "Port": __DB_PORT__,
          "Parameter": "?parseTime=true"
        }
      },
      "Email": {
        "Username": "",
        "Password": "",
        "Hostname": "",
        "Port": 25,
        "From": ""
      },
      "Recaptcha": {
        "Enabled": false,
        "Secret": "",
        "SiteKey": ""
      },
      "Server": {
        "Hostname": "",
        "UseHTTP": {{ .Values.config.server.useHTTP }},
        "UseHTTPS": {{ .Values.config.server.useHTTPS }},
        "HTTPPort": {{ .Values.config.server.httpPort }},
        "HTTPSPort": {{ .Values.config.server.httpsPort | default 443 }},
        "CertFile": "tls/server.crt",
        "KeyFile": "tls/server.key"
      },
      "Session": {
        "SecretKey": "__SESSION_SECRET_KEY__",
        "Name": "{{ .Values.config.session.name }}",
        "Options": {
          "Path": "/",
          "Domain": "",
          "MaxAge": {{ .Values.config.session.maxAge }},
          "Secure": {{ .Values.config.session.secure }},
          "HttpOnly": {{ .Values.config.session.httpOnly }}
        }
      },
      "Template": {
        "Root": "base",
        "Children": [
          "partial/menu",
          "partial/footer"
        ]
      },
      "View": {
        "BaseURI": "{{ .Values.config.view.baseURI }}",
        "Extension": "{{ .Values.config.view.extension }}",
        "Folder": "{{ .Values.config.view.folder }}",
        "Name": "blank",
        "Caching": {{ .Values.config.view.caching }}
      }
    }
