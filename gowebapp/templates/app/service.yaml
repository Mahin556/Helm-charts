# =============================================================================
# Service — exposes the app externally
# Change type to NodePort for local clusters (minikube, kind)
# =============================================================================

{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: '{{ include "gowebapp.fullname" . }}{{ .Values.service.suffix }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    {{- include "gowebapp.labels" . | nindent 4 }}
spec:
  type: '{{ .Values.service.type }}'
  selector:
    {{- include "gowebapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- end }}