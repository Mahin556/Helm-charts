# Global settings
global:
  namespace: gowebapp
  imagePullPolicy: Always

# Application settings
app:
  name: gowebapp
  replicaCount: 2
  image:
    repository: mahinraza556/gowebapp
    tag: "23628467642"
    pullPolicy: Always
  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    APP_ENV: production
    APP_PORT: "8080"
  securityContext:
    runAsUser: 1001
    runAsNonRoot: true
    fsGroup: 1001


# Database settings
mysql:
  enabled: true
  image: mysql:8.0
  replicaCount: 1
  storage:
    size: 5Gi
    storageClass: ""  # Use default storage class
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    database: gowebapp
    user: gowebapp
    host: mysql-service
    port: 3306

# ConfigMap settings
configmap:
  server:
    httpPort: 8080
    useHTTP: true
    useHTTPS: false
  session:
    name: gosess
    maxAge: 28800
    secure: false
    httpOnly: true
  view:
    caching: true
    baseURI: /
    extension: tmpl
    folder: template

# Sealed Secrets (encrypted values)
sealedSecrets:
  # These is encrypted with kubeseal with cluster-wide scope
  mysql:
    appPassword: ""  # Will be encrypted
    rootPassword: ""  # Will be encrypted
  session:
    secretKey: ""  # Will be encrypted
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"

# Network Policy
networkPolicy:
  enabled: true  # Set to false to disable network policies

ingress:
  enabled: true
  ingressClassName: nginx
  sslRedirect: true
  annotations: {}

  hosts:
    - host: gowebapp.mahinraza.online
      paths:
        - path: /
          pathType: Prefix
    - host: api.gowebapp.mahinraza.online
      paths:
        - path: /
          pathType: Prefix

  tls:
    enabled: true
    secretName: gowebapp-tls
    
    # Option 1: Use Cert-Manager (Recommended for production)
    certManager:
      enabled: false
      issuerName: letsencrypt-prod
      duration: 2160h  # 90 days
      renewBefore: 360h  # 15 days
    
    # Option 2: Use Sealed Secret (for imported/self-signed certs)
    sealedSecret:
      enabled: true  # Set to true if not using cert-manager
      cert: ""  # Encrypted certificate
      key: ""
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80